<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="meridians-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0c884"/>
      <stop offset="55%" stop-color="#C8AC70"/>
      <stop offset="100%" stop-color="#a88c4f"/>
    </linearGradient>
    <linearGradient id="meridians-ivory" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F0E7"/>
      <stop offset="100%" stop-color="#ddd3ba"/>
    </linearGradient>
    <radialGradient id="meridians-halo" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#C8AC70" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#C8AC70" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C8AC70" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft halo -->
  <circle cx="60" cy="60" r="58" fill="url(#meridians-halo)"/>

  <!-- outer ring (globe) -->
  <circle cx="60" cy="60" r="46" stroke="url(#meridians-gold)" stroke-width="1.6" fill="none"/>

  <!-- meridian arcs (vertical great circles) -->
  <path d="M60 14 C32 32 32 88 60 106" stroke="url(#meridians-gold)" stroke-width="1.2" fill="none" opacity="0.85"/>
  <path d="M60 14 C88 32 88 88 60 106" stroke="url(#meridians-gold)" stroke-width="1.2" fill="none" opacity="0.85"/>
  <path d="M60 14 C44 34 44 86 60 106" stroke="url(#meridians-gold)" stroke-width="0.9" fill="none" opacity="0.55"/>
  <path d="M60 14 C76 34 76 86 60 106" stroke="url(#meridians-gold)" stroke-width="0.9" fill="none" opacity="0.55"/>

  <!-- equator + parallels -->
  <line x1="14" y1="60" x2="106" y2="60" stroke="url(#meridians-gold)" stroke-width="1" opacity="0.7"/>
  <ellipse cx="60" cy="60" rx="46" ry="16" stroke="url(#meridians-gold)" stroke-width="0.8" fill="none" opacity="0.45"/>
  <ellipse cx="60" cy="60" rx="46" ry="30" stroke="url(#meridians-gold)" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- horizon line across the globe -->
  <line x1="22" y1="60" x2="98" y2="60" stroke="url(#meridians-ivory)" stroke-width="0.6" opacity="0.5"/>

  <!-- central grain stalk (commodity / agricultural origin) -->
  <g stroke="url(#meridians-gold)" stroke-width="1.6" stroke-linecap="round" fill="none">
    <line x1="60" y1="38" x2="60" y2="84"/>
    <!-- grain awns (left) -->
    <path d="M60 44 C55 43 52 40 51 36"/>
    <path d="M60 52 C54 51 50 48 49 43"/>
    <path d="M60 60 C53 59 48 56 47 50"/>
    <!-- grain awns (right) -->
    <path d="M60 44 C65 43 68 40 69 36"/>
    <path d="M60 52 C66 51 70 48 71 43"/>
    <path d="M60 60 C67 59 72 56 73 50"/>
    <!-- top tip -->
    <line x1="60" y1="38" x2="60" y2="34"/>
  </g>

  <!-- central grain seed (node) -->
  <circle cx="60" cy="60" r="2.4" fill="url(#meridians-gold)"/>
</svg>
